<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sonic Branding Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Inter, sans-serif;
    background: radial-gradient(circle at 50% 0%, #151515 0%, #080808 100%);
    color:#EEE;
    min-height:100vh;
    user-select:none;
    overflow-x:hidden;
    transition: background 0.3s ease, color 0.3s ease;
}
/* Dynamic Styles */
:root {
    --brand-primary: #1D6247;
    --brand-accent: #1EBB72;
    --brand-primary-rgb: 29, 98, 71;
    --system-surface: #0C0C0C;
    --system-card: #141414;
}
.overlay-lock{
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(circle at 50% 100%, rgba(var(--brand-primary-rgb), 0.05), transparent 70%);
    z-index:2;
}
.header{
    padding:12px 20px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    background:var(--system-surface);
    position:sticky;
    top:0;
    z-index:100;
}
.header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--brand-primary), transparent);
    background-size: 200% 100%;
    animation: energy-flow 4s linear infinite;
    box-shadow: 0 0 10px var(--brand-primary);
}
@keyframes energy-flow {
    0% { background-position: 100% 0%; }
    100% { background-position: -100% 0%; }
}
.header-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}
.header-titles {
    min-width: 0;
    flex: 1;
}
.header h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:18px;
    margin:0;
    letter-spacing:1px;
    color:#FFF;
    text-transform: uppercase;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.header p{
    margin:0;
    color:#666;
    font-size:10px;
    font-weight:700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.container{
    padding:30px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(400px,1fr));
    gap:25px;
    position: relative;
    z-index: 5;
}
.card-wrap {
    position: relative;
    padding: 1px;
}
.backlight {
    position: absolute;
    inset: -40px;
    background: radial-gradient(circle at center, rgba(var(--card-glow-rgb, var(--brand-primary-rgb)), 0.1), transparent 60%);
    opacity: 0.5;
    z-index: 0;
    animation: glow-pulse 6s ease-in-out infinite;
    pointer-events: none;
    transition: opacity 0.6s, transform 0.6s cubic-bezier(0.2, 0, 0, 1);
    filter: blur(40px);
}
@keyframes glow-pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.9); }
    50% { opacity: 0.6; transform: scale(1.1); }
}
.card-wrap:hover .backlight {
    opacity: 0.9;
    transform: scale(1.15);
}
.card{
    background:var(--system-card);
    border-radius:2px;
    padding:0;
    border:1px solid rgba(255,255,255,0.06);
    box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    position:relative;
    overflow:hidden;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.4s;
    display:flex;
    flex-direction:column;
    z-index: 1;
}
.card:hover{
    transform: translateY(-8px);
    border-color: rgba(var(--card-glow-rgb, var(--brand-primary-rgb)), 0.3);
}
.card-section{
    padding:18px 22px;
    border-bottom:1px solid rgba(255,255,255,0.02);
    position: relative;
    z-index: 10;
}
.card-section:last-child{border-bottom:none;}
.mode{
    font-size:9px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#555;
    font-weight:800;
    margin-bottom:2px;
}
.title{
    font-family:'Space Grotesk', sans-serif;
    font-size:16px;
    margin:0;
    font-weight: 800;
    color:#FFF;
    letter-spacing: -0.2px;
}
.desc{
    font-size:11px;
    color:#888;
    line-height:1.4;
    margin-top:6px;
}
.controls{
    margin-top:10px;
    display:flex;
    align-items:center;
    gap:8px;
}
.play{
    width:40px;height:40px;border-radius:4px;
    border:1px solid #333;
    background:var(--system-surface);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:14px;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    font-weight:900;
    color: #FFF;
}
.play:hover{background:#222; border-color: var(--brand-primary); box-shadow: 0 0 15px rgba(var(--brand-primary-rgb), 0.3);}
.play:active{transform:scale(0.96);}
.progress-wrap{
    flex:1;height:2px;background:#222;overflow:hidden;
}
.progress{
    height:100%;width:0%;background:var(--brand-primary);
    box-shadow: 0 0 5px var(--brand-primary);
    transition: width 0.2s linear;
}
/* Spotify-Style UI Overhaul (v4.0) */
.mini-player-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    background: rgba(15,15,15,0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.05);
    padding: 12px 20px;
    display: none; /* Hidden by default */
    transform: translateY(100%);
    transition: transform 0.5s cubic-bezier(0.2, 0, 0, 1);
}
.mini-player-wrap.active {
    display: block;
    transform: translateY(0);
}
.player-inner {
    max-width: 600px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 15px;
}
.player-info { flex: 1; min-width: 0; }
.player-title { font-size: 13px; font-weight: 700; color: #FFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-subtitle { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 1px; }

.player-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}
.player-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--brand-primary);
    display: flex; align-items: center; justify-content: center;
    color: #FFF;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(var(--brand-primary-rgb), 0.3);
}
.player-progress-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 2px;
    background: rgba(255,255,255,0.05);
}
.player-progress-bar {
    height: 100%;
    background: var(--brand-primary);
    width: 0%;
    transition: width 0.1s linear;
}

body.light-mode .mini-player-wrap {
    background: rgba(255,255,255,0.95);
    border-top-color: rgba(0,0,0,0.05);
}
body.light-mode .player-title { color: #111; }
body.light-mode .player-subtitle { color: #888; }
body.light-mode .player-progress-container { background: rgba(0,0,0,0.05); }

/* Branded Hero Player v4.8 */
.hero-player {
    max-width: 600px;
    margin: 20px auto;
    background: rgba(25, 25, 25, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    padding: 25px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(20px);
    box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 40px rgba(var(--brand-primary-rgb), 0.1);
    z-index: 10;
}
.hero-player::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at top right, rgba(var(--brand-primary-rgb), 0.1), transparent 70%);
    pointer-events: none;
}
.hero-player-content {
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 2;
}
.hero-info { flex: 1; }
.hero-track-name { font-size: 18px; font-weight: 800; color: #FFF; margin-bottom: 4px; letter-spacing: -0.5px; }
.hero-track-artist { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
.hero-btn {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: var(--brand-primary);
    color: #FFF;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    box-shadow: 0 10px 25px rgba(var(--brand-primary-rgb), 0.4);
}
.hero-btn:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(var(--brand-primary-rgb), 0.5); }
.hero-btn:active { transform: scale(0.95); }
.hero-btn.loading, .track-play-btn.loading {
    animation: loading-pulse 1s ease-in-out infinite;
    opacity: 0.6;
    pointer-events: none;
}
@keyframes loading-pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.98); }
    50% { opacity: 0.8; transform: scale(1); }
}

.hero-progress-area { margin-top: 25px; }
.hero-time-row { display: flex; justify-content: space-between; font-size: 9px; color: #555; font-family: monospace; margin-top: 8px; font-weight: 700; }
.hero-progress-bg { height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; position: relative; cursor: pointer; }
.hero-progress-bg:hover { height: 6px; margin-top: -1px; background: rgba(255,255,255,0.1); }
.hero-progress-fill { height: 100%; background: var(--brand-primary); width: 0%; box-shadow: 0 0 15px var(--brand-primary); transition: width 0.1s linear; pointer-events: none; }

/* Enhanced Track Highlights */
.track-item.playing {
    background: rgba(var(--brand-primary-rgb), 0.2) !important;
    border-left: 4px solid var(--brand-primary) !important;
    transform: scale(1.01) !important;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4) !important;
    opacity: 1 !important;
}
.track-item.playing .track-name { color: #FFF; text-shadow: 0 0 15px rgba(var(--brand-primary-rgb), 0.4); }
.track-item.playing .track-play-btn { background: var(--brand-primary); border-color: var(--brand-primary); }

body.light-mode .hero-player { background: #FFF; border-color: #EEE; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
body.light-mode .hero-track-name { color: #111; }
body.light-mode .hero-track-artist { color: #888; }
.hero-player.playing {
    border-color: rgba(var(--brand-primary-rgb), 0.3);
    box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 50px rgba(var(--brand-primary-rgb), 0.2);
}
.hero-player.playing .hero-btn {
    animation: hero-pulse 2s infinite;
}
@keyframes hero-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(var(--brand-primary-rgb), 0.5); transform: scale(1); }
    50% { box-shadow: 0 0 20px 8px rgba(var(--brand-primary-rgb), 0.3); transform: scale(1.02); }
}

/* Playlist Experience: Single View v4.6 */
.playlist-node-wrap {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 20px 0 10px;
    padding: 10px;
}
.playlist-node {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 800;
    color: #666;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
}
.playlist-node.active {
    background: var(--brand-primary);
    border-color: var(--brand-primary);
    color: #FFF;
    box-shadow: 0 0 15px rgba(var(--brand-primary-rgb), 0.3);
    transform: scale(1.1);
}
.playlist-node:hover:not(.active) {
    background: rgba(255,255,255,0.1);
    color: #FFF;
}

.playlist-view-container {
    max-width: 600px;
    margin: 0 auto 100px; /* Space for sticky nav */
    position: relative;
    overflow: hidden;
    min-height: 500px;
    z-index: 5;
}
.playlist-slider {
    display: flex;
    transition: transform 0.3s ease-out;
}
.playlist-slide {
    flex: 0 0 100%;
    width: 100%;
}
.playlist-slide .playlist-card {
    opacity: 0.4;
    transform: scale(0.98);
    transition: opacity 0.2s ease-out, transform 0.2s ease-out;
}
.playlist-slide.active .playlist-card {
    opacity: 1;
    transform: scale(1);
}
.playlist-nav {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    gap: 20px;
    z-index: 1000;
    background: rgba(13,13,13,0.8);
    backdrop-filter: blur(20px);
    padding: 12px 24px;
    border-radius: 40px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    width: fit-content;
}
.nav-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #FFF;
    padding: 10px 24px;
    border-radius: 24px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    text-transform: uppercase;
}
.nav-btn:active:not(:disabled) {
    transform: scale(0.96);
}
.nav-btn:hover:not(:disabled) {
    background: var(--brand-primary);
    border-color: var(--brand-primary);
    box-shadow: 0 0 20px rgba(var(--brand-primary-rgb), 0.3);
}
.nav-btn:disabled {
    opacity: 0.1;
    cursor: not-allowed;
}

/* Redefining Playlist Card for Single View */
.playlist-card {
    background: rgba(20, 20, 20, 0.8);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 30px;
    backdrop-filter: blur(15px);
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
    opacity: 1 !important;
    transform: scale(1) !important;
    margin: 0 10px;
}
.playlist-card .track-list {
    max-height: 1000px;
    opacity: 1;
    margin-top: 25px;
}

body.light-mode .playlist-card { background: #FFF; border-color: #EEE; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
body.light-mode .nav-btn { background: #F0F0F0; color: #333; border-color: #DDD; }
body.light-mode .nav-btn:hover:not(:disabled) { background: var(--brand-primary); color: #FFF; }
body.light-mode .playlist-nav { background: rgba(255,255,255,0.8); border-color: #EEE; }
body.light-mode .playlist-node { background: #F5F5F5; border-color: #EEE; color: #999; }
body.light-mode .playlist-node.active { background: var(--brand-primary); color: #FFF; }
.footer {
    text-align: center;
    padding: 60px 20px;
    font-size: 10px;
    font-weight: 800;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 2px;
    width: 100%;
}
.playlist-card.active .playlist-name {
    font-size: 24px;
    color: #FFF;
    text-shadow: 0 0 10px rgba(var(--brand-primary-rgb), 0.5);
}
.playlist-header {
    display: flex;
    align-items: center;
    gap: 20px;
}
.playlist-meta {
    flex: 1;
}
.playlist-idx {
    font-size: 10px;
    font-weight: 800;
    color: var(--brand-primary);
    letter-spacing: 2px;
    margin-bottom: 2px;
}
.playlist-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #FFF;
    text-transform: capitalize;
}
.playlist-count {
    font-size: 9px;
    color: #555;
    font-weight: 700;
}
.playlist-card.active .playlist-count { color: var(--brand-accent); }

.placeholder-msg {
    padding: 20px;
    text-align: center;
    font-size: 11px;
    color: #444;
    font-style: italic;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
    margin-top: 15px;
}
.track-list {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: all 0.8s cubic-bezier(0.2, 0, 0, 1);
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.track-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 12px 15px;
    background: rgba(255,255,255,0.02);
    border-radius: 4px;
    transition: all 0.3s;
}
.track-item:hover {
    background: rgba(255,255,255,0.05);
}
.track-item.playing {
    background: rgba(var(--brand-primary-rgb), 0.15);
    border-left: 4px solid var(--brand-primary);
    transform: scale(1.01);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    opacity: 1;
}
.track-item:not(.playing) { opacity: 0.8; }
.track-item.playing .track-name { 
    color: #FFF; 
    text-shadow: 0 0 10px rgba(var(--brand-primary-rgb), 0.4);
}
.track-info {
    flex: 1;
}
.track-name { font-size: 13px; font-weight: 700; color: #EEE; }
.track-meta { font-size: 9px; color: #666; text-transform: uppercase; margin-top: 2px; }
.track-duration { font-size: 10px; color: #444; font-family: monospace; }

.track-play-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.3s;
    border: 1px solid rgba(255,255,255,0.1);
}
.track-play-btn:hover {
    background: var(--brand-primary);
    color: #FFF;
}
.track-item.playing .track-play-btn {
    background: var(--brand-primary);
    animation: track-pulse 2s infinite;
}
@keyframes track-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(var(--brand-primary-rgb), 0.3); }
    50% { box-shadow: 0 0 15px 2px rgba(var(--brand-primary-rgb), 0.2); }
}

body.light-mode .playlist-card {
    background: rgba(255,255,255,0.8);
    border-color: rgba(0,0,0,0.05);
}
body.light-mode .playlist-card.active {
    background: #FFF;
    border-color: var(--brand-primary);
    box-shadow: 0 40px 80px rgba(0,0,0,0.1), 0 0 20px rgba(var(--brand-primary-rgb), 0.1);
}
body.light-mode .playlist-name { color: #111; }
body.light-mode .playlist-card.active .playlist-name { color: #000; text-shadow: none; }
body.light-mode .track-item { background: #F9F9F9; }
body.light-mode .track-item:hover { background: #F0F0F0; }
body.light-mode .track-name { color: #222; }
body.light-mode .track-item.playing { background: rgba(var(--brand-primary-rgb), 0.05); }
.whatsapp-btn, .action-btn{
    display:inline-block;
    padding:10px 14px;
    border-radius:4px;
    background:#EEE;
    color:#000;
    font-weight:800;
    text-decoration:none;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border:none;
    cursor:pointer;
    text-align:center;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
}
.whatsapp-btn:hover, .action-btn:hover{
    background:#FFF; 
    box-shadow: 0 0 20px rgba(255,255,255,0.2);
}
.whatsapp-btn:active, .action-btn:active{transform:scale(0.96);}
.action-btn.secondary{
    background:rgba(255,255,255,0.03);
    color:#999;
    border:1px solid rgba(255,255,255,0.1);
}
.action-btn.secondary:hover{border-color:rgba(255,255,255,0.3); color:#FFF; background: rgba(255,255,255,0.05);}
.action-btn.primary-command{
    background: var(--brand-primary);
    color: #FFF;
    flex: 1.2;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 4px 15px rgba(var(--brand-primary-rgb), 0.3);
    animation: ignite-breathe 4s ease-in-out infinite;
    position: relative;
    overflow: hidden;
}
@keyframes ignite-breathe {
    0%, 100% { filter: brightness(1); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 0 20px rgba(var(--brand-primary-rgb), 0.1); }
    50% { filter: brightness(1.15); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 0 40px rgba(var(--brand-primary-rgb), 0.4); }
}
.action-btn.primary-command:hover {
    filter: brightness(1.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 0 30px rgba(var(--brand-primary-rgb), 0.7);
    animation: none;
    transform: translateY(-2px);
}
.action-btn.primary-command:active {
    filter: brightness(2);
    transform: scale(0.97);
    box-shadow: inset 0 10px 20px rgba(0,0,0,0.4);
    transition: 0.1s;
}

/* Analytics Grid */
.stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
}
.stat-item{
    text-align:left;
    padding:5px 0;
}
.stat-label{
    font-size:8px;
    text-transform:uppercase;
    font-weight:900;
    color:#444;
    letter-spacing:1px;
    margin-bottom: 0px;
}
.stat-value{
    font-size:24px;
    font-weight:900;
    color:#FFF;
    line-height: 1;
    letter-spacing: -0.5px;
    transition: color 0.3s;
}
.pulse-value {
    animation: stat-pulse 0.5s ease-out;
}
@keyframes stat-pulse {
    0% { color: var(--brand-accent); text-shadow: 0 0 10px var(--brand-accent); transform: scale(1.05); }
    100% { color: #FFF; text-shadow: none; transform: scale(1); }
}

/* Modal System */
.modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.85);
    z-index:1000; display:none; align-items:center; justify-content:center;
    padding:20px;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease-out;
}
.modal-content{
    background:var(--system-surface); width:100%; max-width:550px;
    max-height:85vh; border-radius:4px;
    display:flex; flex-direction:column;
    box-shadow:0 0 50px rgba(0,0,0,1);
    border: 1px solid #333;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.modal-overlay.show{
    display: flex;
}
.modal-overlay.show .modal-content {
    transform: translateY(0);
    opacity: 1;
}
.modal-header{
    padding:15px 20px; border-bottom:1px solid #222;
    display:flex; justify-content:space-between; align-items:center;
    background: #0D0D0D;
}
.modal-title{
    font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:800;
    text-transform:uppercase; letter-spacing:1px; color:#FFF;
}
.modal-body{
    padding:20px; overflow-y:auto; flex:1;
}
.modal-close{
    cursor:pointer; font-size:24px; color:#444; transform:rotate(45deg); line-height:1; font-weight: 300; transition: color 0.2s;
}
.modal-close:hover { color: #FFF; }

/* Cinematic Insight Bar */
.insight-bar{
    background: rgba(0,0,0,0.4);
    border-bottom: 1px solid rgba(255,255,255,0.03);
    padding: 8px 20px;
    font-size: 9px;
    font-family: monospace;
    color: #888;
    display: flex;
    gap: 25px;
    overflow-x: auto;
    white-space: nowrap;
    position: relative;
    z-index: 9;
}
.insight-item{
    display: flex;
    align-items: center;
    gap: 8px;
}
.insight-label{
    color: var(--brand-accent);
    font-weight: 900;
}
.leading-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--brand-primary);
    color: #FFF;
    font-size: 8px;
    font-weight: 900;
    padding: 2px 6px;
    border-radius: 2px;
    letter-spacing: 1px;
    box-shadow: 0 0 10px rgba(var(--brand-primary-rgb), 0.5);
    z-index: 15;
    animation: badge-pulse 2s infinite;
}
@keyframes badge-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(0.95); }
}
.card-wrap.spike .backlight {
    animation: spike-pulse 1s ease-in-out infinite;
}
@keyframes spike-pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); filter: brightness(1.5); }
}
.card-wrap.dead .backlight, .card-wrap.low .backlight {
    opacity: 0.1;
    filter: grayscale(1) blur(80px);
    animation: none;
}
.card-wrap.strong .backlight {
    opacity: 0.85;
    background: radial-gradient(circle at center, rgba(var(--card-glow-rgb, var(--brand-primary-rgb)), 0.3), transparent 70%);
}
.card-wrap.leading .backlight {
    opacity: 0.8;
    background: radial-gradient(circle at center, rgba(var(--card-glow-rgb, var(--brand-primary-rgb)), 0.25), transparent 70%);
}
.card-wrap.leading .card {
    border-color: rgba(var(--card-glow-rgb, var(--brand-primary-rgb)), 0.6);
}
.rank-shift {
    animation: rank-pulse 0.8s cubic-bezier(0.2, 0, 0, 1);
}
@keyframes rank-pulse {
    0% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.03); filter: brightness(1.5); box-shadow: 0 0 50px rgba(var(--brand-primary-rgb), 0.5); }
    100% { transform: scale(1); filter: brightness(1); }
}
/* GATEWAY MODULE (NEW LAYER) */
.gateway-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: #080808;
    position: relative;
    overflow: hidden;
    animation: gateway-enter 0.8s cubic-bezier(0.2, 0, 0, 1) forwards;
    transition: background 0.3s ease, border-color 0.3s ease;
}

/* Environment Layer: Drifting Haze */
.gateway-wrap::after {
    content: '';
    position: absolute;
    inset: -50%;
    background: radial-gradient(circle at 30% 30%, rgba(var(--brand-primary-rgb), 0.05) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(var(--brand-accent-rgb), 0.03) 0%, transparent 40%);
    animation: haze-drift 15s linear infinite;
    z-index: 0;
    pointer-events: none;
}
@keyframes haze-drift {
    0% { transform: translate(0, 0) rotate(0deg); }
    50% { transform: translate(5%, 5%) rotate(5deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
}

/* Street Light concept: Overhead beams */
.street-light-beam {
    position: absolute;
    top: 0;
    width: 200px;
    height: 80vh;
    background: linear-gradient(to bottom, rgba(255,255,255,0.03), transparent);
    filter: blur(40px);
    z-index: 1;
    pointer-events: none;
    transform-origin: top;
}
.street-light-beam:nth-child(1) { left: 15%; transform: rotate(-5deg); }
.street-light-beam:nth-child(2) { right: 15%; transform: rotate(5deg); }

.gateway-wrap::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 50%, rgba(var(--brand-primary-rgb), 0.08) 0%, transparent 70%);
    animation: glow-breathe 8s ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
    transition: background 0.3s ease;
}
@keyframes gateway-enter {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes glow-breathe {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.1); }
}
@keyframes intro-enter {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.gateway-identity {
    text-align: center;
    margin-bottom: 60px;
    z-index: 10;
}
.gateway-identity h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 48px;
    letter-spacing: 6px;
    margin: 0;
    text-transform: uppercase;
    font-weight: 800;
    color: #FFFFFF;
    text-shadow: 0 10px 40px rgba(0,0,0,0.5);
    line-height: 1.1;
}
.gateway-identity p {
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--brand-accent);
    text-transform: uppercase;
    margin-top: 15px;
    font-weight: 800;
    opacity: 1;
    text-shadow: 0 0 10px rgba(var(--brand-primary-rgb), 0.3);
}
.gateway-intro {
    max-width: 550px;
    text-align: center;
    margin-bottom: 60px;
    font-size: 14px;
    color: #AAA;
    line-height: 1.8;
    font-style: italic;
    z-index: 10;
    opacity: 0;
    animation: intro-enter 1.2s cubic-bezier(0.2, 0, 0, 1) forwards;
    animation-delay: 0.7s;
}
.gate-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    width: 100%;
    max-width: 900px;
    z-index: 10;
}
.gate-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    padding: 60px 30px;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    position: relative;
    overflow: visible; /* Show halos */
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    opacity: 0;
    animation: gate-stagger 0.6s cubic-bezier(0.2, 0, 0, 1) forwards;
    z-index: 10;
}

/* Striplight System */
.striplight-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--brand-primary), transparent);
    background-size: 200% 100%;
    animation: striplight-flow 3s linear infinite;
    z-index: 5;
    opacity: 0.6;
}
@keyframes striplight-flow {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}

/* Card Halo backlight */
.gate-halo {
    position: absolute;
    inset: -20px;
    background: radial-gradient(circle at center, rgba(var(--brand-primary-rgb), 0.15) 0%, transparent 75%);
    z-index: -1;
    border-radius: 50%;
    animation: halo-breathe 4s ease-in-out infinite;
    pointer-events: none;
    opacity: 0.8;
}
@keyframes halo-breathe {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 0.8; transform: scale(1.05); }
}

/* Portal Differentiation */
.gate-card.control .striplight-top {
    height: 2px;
    filter: brightness(1.5);
    animation-duration: 2s;
}
.gate-card.control .gate-halo {
    background: radial-gradient(circle at center, rgba(var(--brand-primary-rgb), 0.25) 0%, transparent 75%);
    animation-duration: 3s;
}

.gate-card:nth-child(1) { animation-delay: 0.3s; }
.gate-card:nth-child(2) { animation-delay: 0.5s; }

@keyframes gate-stagger {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.gate-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(var(--brand-primary-rgb), 0.3), transparent 75%);
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 0;
}
.gate-card:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(var(--brand-primary-rgb), 0.5);
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 40px 80px rgba(0,0,0,0.6);
}
.gate-card:active {
    transform: scale(0.97);
    transition: 0.1s;
}
.gate-card:hover::before {
    opacity: 1;
}
.gate-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: #FFFFFF;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 12px;
    position: relative;
    z-index: 2;
    text-shadow: 0 0 20px rgba(0,0,0,0.5);
}
.gate-desc {
    font-size: 11px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
    position: relative;
    z-index: 2;
}
.gate-card:hover .gate-desc {
    color: #CCC;
}
@media (max-width: 768px) {
    .gate-grid { grid-template-columns: 1fr; gap: 20px; }
    .gateway-identity h1 { font-size: 32px; }
    .gate-card { padding: 40px 20px; }
}

/* Gateway Theme Switcher */
.theme-switcher {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 1000;
}
.theme-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    color: #FFF;
    padding: 10px 18px;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    backdrop-filter: blur(20px);
    transition: all 0.4s cubic-bezier(0.2, 0, 0, 1);
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
@media (max-width: 768px) {
    .theme-switcher {
        top: 16px;
        right: 16px;
    }
    .theme-btn {
        padding: 8px 14px;
        font-size: 8px;
    }
    .gateway-identity {
        padding-top: 40px; /* Collision buffer for switcher */
    }
}
.theme-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}
.theme-btn:active { transform: scale(0.95); }

/* Gateway Light Mode Overrides */
body.light-mode {
    background: #F5F5F2;
    background: radial-gradient(circle at 50% 0%, #FFFFFF 0%, #E8E8E4 100%);
    color: #111;
}

body.light-mode .header p { color: #666; }

body.light-mode .card .desc { color: #666; }

body.light-mode .action-btn.secondary { background: #F0F0F0; border-color: #DDD; color: #444; }
body.light-mode .insight-bar { background: rgba(0,0,0,0.03); border-bottom-color: rgba(0,0,0,0.05); color: #666; }

body.light-mode .gateway-wrap {

}

}
body.light-mode .gateway-identity h1 {

}
body.light-mode .gateway-intro {

}
body.light-mode .gate-card {

}
body.light-mode .gate-halo {

}

}

}

}

    color: #888;
}

/* Gateway Conversion & Share Layer */
.gate-conversion-layer {
    margin-top: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 25px;
    z-index: 10;
    width: 100%;
}
.gate-cta-btn {
    background: var(--brand-primary);
    color: #FFF;
    padding: 16px 32px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    border: none;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.2, 0, 0, 1);
    box-shadow: 0 10px 30px rgba(var(--brand-primary-rgb), 0.3);
    display: flex;
    align-items: center;
    gap: 12px;
}
.gate-cta-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 20px 40px rgba(var(--brand-primary-rgb), 0.5);
    filter: brightness(1.1);
}
.gate-cta-btn:active { transform: scale(0.97); }

.gate-share-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.gate-share-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    color: #888;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.3s;
}
.gate-share-btn:hover {
    border-color: rgba(255,255,255,0.3);
    color: #FFF;
}
.gateway-wrap.light-mode .gate-share-btn {
    border-color: rgba(0,0,0,0.1);
    color: #666;
}
.gateway-wrap.light-mode .gate-share-btn:hover {
    border-color: rgba(0,0,0,0.3);
    color: #000;
}

.gate-share-panel {
    position: absolute;
    bottom: calc(100% + 15px);

    border-radius: 6px;

    gap: 10px;
    min-width: 180px;

@keyframes panel-up {
    from { opacity: 0; transform: translateY(10px); }

}
.gate-share-panel.active { display: flex; }

.share-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 4px;
    color: #AAA;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;

}
.share-option:hover {
    background: rgba(255,255,255,0.05);
    color: #FFF;
}
.gateway-wrap.light-mode .gate-share-panel {
    background: rgba(255,255,255,0.95);
    border-color: rgba(0,0,0,0.1);
    box-shadow: 0 20px 50px rgba(0,0,0,0.1);
}
.gateway-wrap.light-mode .share-option {
    color: #666;
}
.gateway-wrap.light-mode .share-option:hover {
    background: rgba(0,0,0,0.05);
    color: #000;
}

.gate-powered {
    margin-top: 60px;
    font-size: 9px;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 800;
    opacity: 0.6;
}

/* PHASE GATE: CONTROL ROOM (v5.4) */
.system-gate-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    animation: gate-fade-in 0.6s cubic-bezier(0.2, 0, 0, 1);
    color: #FFF;
}
@keyframes gate-fade-in {
    from { opacity: 0; backdrop-filter: blur(0px); }
    to { opacity: 1; backdrop-filter: blur(40px); }

.gate-content-box {

.gate-glow {

@keyframes glow-pulse {

}
.gate-badge {

}
.gate-title-main {

    font-weight: 900;

.gate-subtext {

.gate-desc-text {
    font-size: 14px;

}
.gate-footer-brand {
    margin-top: 50px;
    font-size: 9px;
    color: #333;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 700;
}
.gate-main-btn {
    background: #FFF;

    border: none;

    border-radius: 100px;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;

.gate-main-btn:hover {

.gate-phase-label {

}
.notification-wrap {
    position: relative;
    display: inline-block;
}
.icon-btn {
    width: 40px;
    padding: 0 !important;
    font-size: 16px;
    position: relative;
}
.icon-btn.has-new .icon {
    animation: bell-swing 2s ease-in-out infinite;

// App entry point and routing logic
function init() {
    setGlobalTheme(currentTheme);
    
    const params = new URLSearchParams(window.location.search);
    let brandSlug = params.get("brand");
    const mode = params.get("mode");

    // Validate brand exists
    if (brandSlug && !BRANDS[brandSlug]) {
        console.warn(`System: Brand [${brandSlug}] not found. Falling back.`);
        brandSlug = "holiday-inn";
    }

    // Determine initial view mode
    // priority: mode param -> brand param -> default hub
    let finalMode = mode;
    if (!finalMode) {
        if (brandSlug) finalMode = "gateway";
        else finalMode = "hub";
    }

    if (finalMode === "hub") {
        renderHub();
    } else if (finalMode === "gateway") {
        renderGateway(brandSlug || "holiday-inn");
    } else {
        const finalSlug = brandSlug || "holiday-inn";
        renderBrand(finalSlug);
        // Track async
        setTimeout(() => track("brand_view", { brand: finalSlug }), 10);
    }
}

let prevRankingSlugs = [];
let pollInterval = null;

// Render the Master Control Hub
function renderHub() {
    // 1. READ LOCAL DATA IMMEDIATELY
    const current = JSON.parse(localStorage.getItem("sonic_analytics") || "[]");
    const history = JSON.parse(localStorage.getItem("sonic_analytics_history") || "[]");
    
    // Initial Render with Local Data
    renderHubContent(current, history, null);

    // 2. START LIVE POLLING
    if (!pollInterval) {
        pollInterval = setInterval(() => {
            const current = JSON.parse(localStorage.getItem("sonic_analytics") || "[]");
            const history = JSON.parse(localStorage.getItem("sonic_analytics_history") || "[]");
            fetchCloudAnalytics(current, history);
        }, 5000);
    }
    
    // Immediate fetch
    fetchCloudAnalytics(current, history);
}

function fetchCloudAnalytics(current, history) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 3000);

    fetch("https://warstreet-analytics.warstreett.workers.dev/analytics", { signal: controller.signal })
        .then(res => res.ok ? res.json() : null)
        .then(cloudData => {
            clearTimeout(timeout);
            if (cloudData) {
                renderHubContent(current, history, cloudData);
            }
        })
        .catch(() => {
            clearTimeout(timeout);
        });
}


// Internal Core Hub Renderer
function renderHubContent(current, history, cloudData) {
    // 1. PROCESS DATA
    const stats = {};
    const lifetime = {};

    Object.keys(BRANDS).forEach(slug => {
        stats[slug] = { views: 0, plays: 0, clicks: 0 };
        lifetime[slug] = { views: 0, plays: 0, clicks: 0, timestamps: [], lastActive: 0 };
    });

    const processEvents = (events, statsMap, trackTime = false) => {
        events.forEach(log => {
            let eventType = log.event;
            // Map legacy events to new strict types if needed
            if (eventType === "brand_view") eventType = "view";
            if (eventType === "audio_play") eventType = "play";
            if (eventType === "cta_click") eventType = "click";

            const slug = log.brand || (log.data ? log.data.brand : null);
            if (slug && BRANDS[slug]) {
                if (statsMap[slug]) {
                    if (eventType === "view") statsMap[slug].views++;
                    if (eventType === "play") statsMap[slug].plays++;
                    if (eventType === "click") statsMap[slug].clicks++;
                }
                if (trackTime) {
                    const t = log.timestamp || log.time;
                    if (t) {
                        lifetime[slug].timestamps.push(t);
                        if (t > lifetime[slug].lastActive) lifetime[slug].lastActive = t;
                    }
                }
            }
        });
    };

    // Calculate current session stats
    processEvents(current, stats, true);

    // Populate Lifetime stats
    if (cloudData && cloudData.brands) {
        // Use Backend Aggregated Data
        Object.keys(cloudData.brands).forEach(slug => {
            if (lifetime[slug]) {
                lifetime[slug].views = cloudData.brands[slug].views || 0;
                lifetime[slug].plays = cloudData.brands[slug].plays || 0;
                lifetime[slug].clicks = cloudData.brands[slug].clicks || 0;
            }
        });
        // Merge current session into lifetime for optimistic feel
        Object.keys(stats).forEach(slug => {
            lifetime[slug].views += stats[slug].views;
            lifetime[slug].plays += stats[slug].plays;
            lifetime[slug].clicks += stats[slug].clicks;
        });
    } else {
        // Fallback to local history
        processEvents(current, lifetime, true);
        history.forEach(session => processEvents(session.data, lifetime, true));
    }

    // Intelligence Layer: Behavior Analytics
    const now = Date.now();
    const TEN_MINS = 10 * 60 * 1000;

    const ranking = Object.keys(BRANDS).map(slug => {
        const l = lifetime[slug];
        
        // Metrics
        const score = (l.views * 1) + (l.plays * 3) + (l.clicks * 5);
        const total = l.views + l.plays + l.clicks;
        const conv = l.views > 0 ? l.clicks / l.views : 0;
        const pRate = l.views > 0 ? l.plays / l.views : 0;
        
        // Spike detection: events in last 10 mins
        const recentEvents = l.timestamps.filter(t => (now - t) < TEN_MINS).length;
        const isSpiking = recentEvents >= 3;

        // Prioritized Insight
        let insight = null;
        let behavior = "normal";

        if (isSpiking) {
            insight = "Spike detected — brand gaining attention";
            behavior = "spike";
        } else if (l.views >= 5 && conv < 0.1) {
            insight = "High traffic, low conversion — improve call-to-action";
            behavior = "low-conv";
        } else if (pRate >= 0.5 && l.views >= 3) {
            insight = "Strong engagement — audio experience performing well";
            behavior = "strong";
        } else if (l.views > 0 && l.plays === 0) {
            insight = "Dead zone — experience needs a stronger hook";
            behavior = "dead";
        } else if (total < 2 && total > 0) {
            insight = "Low activity — visibility or reach may be limited";
            behavior = "low";
        }

        return { slug, score, total, conv, pRate, insight, behavior, lastActive: l.lastActive };
    }).sort((a, b) => b.score - a.score);

    const topBrand = ranking[0];
    const topSlug = topBrand.score > 0 ? topBrand.slug : null;

    // Rank Shift Detection
    const currentRankingSlugs = ranking.map(r => r.slug);
    const hasRankShift = JSON.stringify(currentRankingSlugs) !== JSON.stringify(prevRankingSlugs);
    prevRankingSlugs = currentRankingSlugs;

    // Insight Bar Refinement
    const insightBar = document.getElementById("insight-bar");
    if (topBrand.score > 0) {
        const topInsights = ranking.filter(r => r.insight).slice(0, 3);
        insightBar.innerHTML = topInsights.map(r => `
            <div class="insight-item">
                <span class="insight-label">${BRANDS[r.slug].name.toUpperCase()}:</span> 
                ${r.insight}
            </div>
        `).join("") || `<div class="insight-item"><span class="insight-label">SYSTEM:</span> Monitoring brand performance...</div>`;
        insightBar.style.display = "flex";
    } else {
        insightBar.style.display = "none";
    }

    // 2. UI SETUP
    applyTheme(BRANDS["warstreet"].theme);
    document.getElementById("brand-name").innerText = "SOUND HUB";
    document.getElementById("brand-tagline").innerText = "WARSTREET COMMAND CENTER · SYSTEM v3.5";
    
    // Inject Header Controls
    const historyLabel = cloudData ? "Cloud" : history.length;
    const unreadCount = notifications.filter(n => !n.read).length;
    
    document.getElementById("header-controls").innerHTML = `
        <div class="notification-wrap">
            <button class="action-btn icon-btn ${unreadCount > 0 ? 'has-new' : ''}" onclick="toggleNotifications(event)">
                <span class="icon">🔔</span>
                ${unreadCount > 0 ? `<span class="noti-badge">${unreadCount}</span>` : ''}
            </button>
            <div id="noti-panel" class="noti-panel">
                <div class="noti-header">SYSTEM ALERTS</div>
                <div id="noti-list" class="noti-list"></div>
            </div>
        </div>
        <button class="action-btn" onclick="toggleHistory()">History (${historyLabel})</button>
        <button class="action-btn secondary" onclick="exportAnalytics()">Export</button>
        <button class="action-btn secondary" onclick="resetAnalytics()">Reset</button>
    `;

    // Process Notifications for this update
    if (cloudData) {
        // Ranking Change Alert
        if (hasRankShift && topSlug && prevRankingSlugs.length > 0) {
            createNotification({
                type: "performance", 
                brand: topSlug, 
                message: `${BRANDS[topSlug].name} is now leading the cluster.`
            });
        }

        // Behavior/Insight Alerts
        ranking.forEach(r => {
            if (r.insight) {
                const type = r.behavior === 'spike' ? 'behavior' : 'insight';
                createNotification({
                    type: type, 
                    brand: r.slug, 
                    message: r.insight
                });
            }
        });
    }

    const container = document.getElementById("playlist-container");
    container.innerHTML = "";
    document.getElementById("whatsapp-container").style.display = "none";
    document.getElementById("info-container").style.display = "none";

    // 3. RENDER SYSTEM PANELS
    Object.keys(BRANDS).forEach(slug => {
        const brand = BRANDS[slug];
        const cardStats = stats[slug];
        const lifeStats = lifetime[slug];

function jumpToPlaylist(index) {
    activePlaylistIdx = index;
    updatePlaylistSlider();
}

function nextPlaylist() {
    const brand = BRANDS[currentBrandSlug];
    if (activePlaylistIdx < brand.playlists.length - 1) {
        activePlaylistIdx++;
        updatePlaylistSlider();
    }
}

function prevPlaylist() {
    if (activePlaylistIdx > 0) {
        activePlaylistIdx--;
        updatePlaylistSlider();
    }
}

function updatePlaylistSlider() {
    const slider = document.getElementById('playlist-slider');
    if (slider) {
        slider.style.transform = `translateX(-${activePlaylistIdx * 100}%)`;
    }
    
    // Update Node States
    document.querySelectorAll('.playlist-node').forEach((node, idx) => {
        if (idx === activePlaylistIdx) node.classList.add('active');
        else node.classList.remove('active');
    });

    // Update Slide Active States for Motion Layer
    document.querySelectorAll('.playlist-slide').forEach((slide, idx) => {
        if (idx === activePlaylistIdx) slide.classList.add('active');
        else slide.classList.remove('active');
    });

    // Update button states
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const brand = BRANDS[currentBrandSlug];
    
    if (prevBtn) prevBtn.disabled = activePlaylistIdx === 0;
    if (nextBtn) nextBtn.disabled = activePlaylistIdx === brand.playlists.length - 1;
}

// Global Audio Controls
function togglePlayback(brandSlug, trackId, file, title, initialTime = 0) {
    if (!file || file === "null" || file === "undefined") return;

    // Loading visual state
    document.querySelectorAll('.hero-btn, .track-play-btn').forEach(el => {
        if (el.onclick && el.onclick.toString().includes(trackId)) el.classList.add('loading');
    });

    // 1. Same track? Toggle
    if (activeTrackId === trackId) {
        if (!activeAudio.paused) {
            activeAudio.pause();
            syncMiniPlayer(false);
            updateTrackUI(trackId, false);
        } else {
            activeAudio.play();
            syncMiniPlayer(true);
            updateTrackUI(trackId, true);
        }
        document.querySelectorAll('.loading').forEach(el => el.classList.remove('loading'));
        return;
    }

    // 2. Different track? Stop previous
    if (activeAudio) {
        activeAudio.pause();
        updateTrackUI(activeTrackId, false);
    }

    // 3. Initialize new audio
    const filePath = file.startsWith('http') ? file : `/audio/${brandSlug}/${file}.mp3`;
    activeAudio = new Audio(filePath);
    activeTrackId = trackId;

    if (initialTime > 0) activeAudio.currentTime = initialTime;
    
    activeAudio.play().then(() => {
        document.querySelectorAll('.loading').forEach(el => el.classList.remove('loading'));
        showMiniPlayer(title, brandSlug);
        updateTrackUI(trackId, true);
        syncHeroPlayer(title, true);
        track('audio_play', { brand: brandSlug, track: trackId });
    }).catch(err => {
        document.querySelectorAll('.loading').forEach(el => el.classList.remove('loading'));
        console.error("Audio playback error:", err);
    });

    activeAudio.onended = () => {
        updateTrackUI(trackId, false);
        syncMiniPlayer(false);
        syncHeroPlayer(title, false);
        
        // Auto-Flow Logic (v5.0)
        if (['holiday-inn', 'gava', 'nandos'].includes(currentBrandSlug)) {
            playNextTrack();
        } else {
            activeTrackId = null;
        }
    };

    activeAudio.ontimeupdate = () => {
        const progress = (activeAudio.currentTime / activeAudio.duration) * 100;
        
        // Persistence (v5.0)
        if (['holiday-inn', 'gava', 'nandos'].includes(currentBrandSlug)) {
            localStorage.setItem(`${currentBrandSlug}_last_tid`, trackId);
            localStorage.setItem(`${currentBrandSlug}_last_time`, activeAudio.currentTime);
        }

        // Mini Progress
        const miniBar = document.getElementById("mini-progress");
        if (miniBar) miniBar.style.width = progress + "%";

        // Hero Progress
        const heroBar = document.getElementById("hero-progress-fill");
        if (heroBar) heroBar.style.width = progress + "%";

        // Time Counters
        const currentEl = document.getElementById("hero-time-current");
        const durationEl = document.getElementById("hero-time-duration");
        if (currentEl) currentEl.innerText = formatAudioTime(activeAudio.currentTime);
        if (durationEl && !isNaN(activeAudio.duration)) durationEl.innerText = formatAudioTime(activeAudio.duration);
    };
}

function showMiniPlayer(title, brandSlug) {
    const player = document.getElementById("mini-player");
    player.innerHTML = `
        <div class="player-progress-container">
            <div id="mini-progress" class="player-progress-bar"></div>
        </div>
        <div class="player-inner">
            <div class="player-info">
                <div class="player-title">${title}</div>
                <div class="player-subtitle">WarStreet Band · ${BRANDS[brandSlug].name}</div>
            </div>
            <div class="player-controls">
                <div class="player-btn" onclick="toggleActiveAudio()">
                    <span id="mini-play-icon">⏸</span>
                </div>
            </div>
        </div>
    `;
    player.classList.add("active");
}

function toggleActiveAudio() {
    if (!activeAudio) {
        // Memory Resumption (v5.0)
        if (['holiday-inn', 'gava', 'nandos'].includes(currentBrandSlug)) {
            const lastTid = localStorage.getItem(`${currentBrandSlug}_last_tid`);
            const lastTime = parseFloat(localStorage.getItem(`${currentBrandSlug}_last_time`) || 0);
            if (lastTid) {
                const brand = BRANDS[currentBrandSlug];
                let trackMeta = null;
                brand.playlists.forEach(pl => {
                    const found = pl.tracks.find(t => t.id === lastTid);
                    if (found) trackMeta = found;
                });
                if (trackMeta) {
                    togglePlayback(currentBrandSlug, trackMeta.id, trackMeta.src || trackMeta.file, trackMeta.title, lastTime);
                    return;
                }
            }
        }
        return;
    }
    if (activeAudio.paused) {
        activeAudio.play();
        syncMiniPlayer(true);
    } else {
        activeAudio.pause();
        syncMiniPlayer(false);
    }
}

function seekAudio(e) {
    if (!activeAudio || !activeAudio.duration) return;
    const bar = document.getElementById('hero-progress-bg');
    const rect = bar.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const width = rect.width;
    const pct = Math.max(0, Math.min(1, x / width));
    activeAudio.currentTime = pct * activeAudio.duration;
}

function playNextTrack() {
    const brand = BRANDS[currentBrandSlug];
    if (!brand) return;
    const playlist = brand.playlists[activePlaylistIdx];
    if (!playlist || playlist.tracks.length === 0) return;

    const currentIdx = playlist.tracks.findIndex(t => t.id === activeTrackId);
    let nextIdx = currentIdx + 1;
    
    // Loop back to start if finished
    if (nextIdx >= playlist.tracks.length) nextIdx = 0;

    const nextTrack = playlist.tracks[nextIdx];
    if (nextTrack) {
        togglePlayback(currentBrandSlug, nextTrack.id, nextTrack.src || nextTrack.file, nextTrack.title);
    }
}

function syncMiniPlayer(isPlaying) {
    const icon = document.getElementById("mini-play-icon");
    if (icon) icon.innerText = isPlaying ? '⏸' : '▶';
    
    const heroIcon = document.getElementById("hero-play-icon");
    if (heroIcon) heroIcon.innerText = isPlaying ? '⏸' : '▶';
    
    updateTrackUI(activeTrackId, isPlaying);
}

function syncHeroPlayer(title, isPlaying) {
    const hero = document.getElementById("hero-player-mount");
    const nameEl = document.getElementById("hero-track-name");
    const icon = document.getElementById("hero-play-icon");
    if (nameEl) nameEl.innerText = title;
    if (icon) icon.innerText = isPlaying ? '⏸' : '▶';
    
    if (hero) {
        if (isPlaying) hero.classList.add('playing');
        else hero.classList.remove('playing');
    }
}

function formatAudioTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec.toString().padStart(2, '0')}`;
}

function updateTrackUI(id, isPlaying) {
    const item = document.getElementById(`item-${id}`);
    if (!item) return;
    
    const btn = item.querySelector('.track-play-btn');
    if (btn) btn.innerText = isPlaying ? '⏸' : '▶';
    
    if (isPlaying) item.classList.add('playing');
    else item.classList.remove('playing');
}

// Main tracking function for local and external sync
function track(event, data) {
    // Normalize event name for strict backend
    let strictEvent = event;
    if (event === "brand_view") strictEvent = "view";
    if (event === "audio_play") strictEvent = "play";
    if (event === "cta_click") strictEvent = "click";

    const brandSlug = data.brand || currentBrandSlug;
    const timestamp = Date.now();
    
    // Strict Structure for Backend
    const payload = {
        brand: brandSlug,
        event: strictEvent,
        timestamp: timestamp
    };

    const eventLog = { event, data, time: timestamp };
    
    console.log("[Analytics]", event, data);
    
    // 1. Local Storage Tracking (Optimistic)
    try {
        let history = JSON.parse(localStorage.getItem("sonic_analytics") || "[]");
        history.push(eventLog);
        if (history.length > 100) history.shift();
        localStorage.setItem("sonic_analytics", JSON.stringify(history));
        
        // Instant Optimistic Update
        if (window.location.search === "" || !window.location.search.includes('brand')) {
            renderHub(); 
        }
    } catch (e) {
        console.error("Local Analytics failed", e);
    }

    // 2. External Sync (Cloudflare Worker + KV)
    fetch("https://warstreet-analytics.warstreett.workers.dev/track", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    }).catch(() => {});
}

// SECTION: EXPORT / RESET FUNCTIONS
// ==============================

// Reset active analytics session to history
function resetAnalytics() {
    try {
        const currentLogs = localStorage.getItem("sonic_analytics");
        if (currentLogs) {
            let sessionHistory = JSON.parse(localStorage.getItem("sonic_analytics_history") || "[]");
            sessionHistory.push({
                archivedAt: Date.now(),
                data: JSON.parse(currentLogs)
            });
            localStorage.setItem("sonic_analytics_history", JSON.stringify(sessionHistory));
        }
        localStorage.removeItem("sonic_analytics");
        renderHub(); // Instant UI update
    } catch (e) {
        console.error("Reset failed", e);
    }
}


// Download analytics data as JSON
function exportAnalytics() {
    const current = JSON.parse(localStorage.getItem("sonic_analytics") || "[]");
    const history = JSON.parse(localStorage.getItem("sonic_analytics_history") || "[]");

    const normalizeEvent = (e) => ({
        event: e.event,
        brand: e.brand || (e.data?.brand || "unknown"),
        track: e.track || (e.data?.track || "n/a"),
        type: e.type || (e.data?.type || "n/a"),
        timeISO: new Date(e.time).toISOString(),
        timeReadable: formatTime(e.time)
    });

    const processSession = (data) => ({
        start: data.length > 0 ? new Date(data[0].time).toISOString() : "n/a",
        end: data.length > 0 ? new Date(data[data.length - 1].time).toISOString() : "n/a",
        events: data.map(normalizeEvent)
    });

    const allSessionsData = [...history.map(h => h.data), current];
    const sessions = allSessionsData.filter(d => d.length > 0).map(processSession);

    const summary = { totalViews: 0, totalPlays: 0, totalClicks: 0 };
    sessions.forEach(s => {
        s.events.forEach(e => {
            if (e.event === "brand_view") summary.totalViews++;
            if (e.event === "audio_play") summary.totalPlays++;
            if (e.event === "cta_click") summary.totalClicks++;
        });
    });

    const exportData = {
        exportedAt: new Date().toISOString(),
        summary: summary,
        sessions: sessions
    };

    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "analytics.json";
    a.click();
    URL.revokeObjectURL(url);
}



// ==============================
// SECTION: NOTIFICATION CENTRE
// ==============================

let notifications = JSON.parse(localStorage.getItem("warstreet_notifications") || "[]");

function createNotification({type, brand, message}) {
    // Deduplication Rule: Update if same message for same brand exists
    const existingIdx = notifications.findIndex(n => n.brand === brand && n.message === message);
    
    if (existingIdx !== -1) {
        // Update timestamp instead of adding new
        notifications[existingIdx].timestamp = Date.now();
        notifications[existingIdx].read = false; 
        console.log("Notification updated:", message);
        saveNotifications();
        return;
    }

    const noti = {
        id: 'noti_' + Date.now() + Math.random().toString(36).substr(2, 5),
        type,
        brand,
        message,
        timestamp: Date.now(),
        read: false
    };

    notifications.unshift(noti);
    if (notifications.length > 50) notifications.pop();
    console.log("Notification created:", message);
    saveNotifications();
}

function saveNotifications() {
    localStorage.setItem("warstreet_notifications", JSON.stringify(notifications));
}

function toggleNotifications(e) {
    e.stopPropagation();
    const panel = document.getElementById("noti-panel");
    panel.classList.toggle("active");
    if (panel.classList.contains("active")) {
        renderNotificationList();
    }
}

function renderNotificationList() {
    const list = document.getElementById("noti-list");
    if (!notifications.length) {
        list.innerHTML = '<div style="padding:40px 20px; text-align:center; color:#444; font-size:12px;">No alerts detected.</div>';
        return;
    }
    
    list.innerHTML = notifications.map(n => `
        <div class="noti-item ${n.read ? 'read' : 'unread'}" onclick="markAsRead('${n.id}', event)">
            <div class="brand">${BRANDS[n.brand]?.name || n.brand}</div>
            <div class="msg">${n.message}</div>
            <div class="time">${formatTime(n.timestamp)}</div>
        </div>
    `).join("");
}

function markAsRead(id, e) {
    e.stopPropagation();
    const noti = notifications.find(n => n.id === id);
    if (noti) {
        noti.read = true;
        saveNotifications();
        renderNotificationList();
        
        // Instant Badge Update
        const unreadCount = notifications.filter(n => !n.read).length;
        const btn = document.querySelector(".icon-btn");
        const badge = btn.querySelector(".noti-badge");
        if (unreadCount === 0) {
            btn.classList.remove("has-new");
            if (badge) badge.remove();
        } else if (badge) {
            badge.innerText = unreadCount;
        }
    }
}

// Close panel on outside click
document.addEventListener('click', () => {
    const notiPanel = document.getElementById("noti-panel");
    if (notiPanel) notiPanel.classList.remove("active");
    
    const gatePanel = document.getElementById("gate-share-panel");
    if (gatePanel) gatePanel.classList.remove("active");
});

// Utility: Format Time Short
function formatTimeShort(ts) {
    const d = new Date(ts);
    return d.getHours().toString().padStart(2, '0') + ":" + d.getMinutes().toString().padStart(2, '0');
}


// Convert timestamp to readable date
function formatTime(ts) {
    return new Date(ts).toLocaleString();
}


// Toggle modal visibility
function toggleHistory() {
    const modal = document.getElementById("historyModal");
    if (modal.classList.contains("show")) {
        modal.classList.remove("show");
        setTimeout(() => modal.style.display = "none", 300);
    } else {
        modal.style.display = "flex";
        setTimeout(() => modal.classList.add("show"), 10);
    }
}


// Update brand visual theme variables
function applyTheme(theme) {
    document.documentElement.style.setProperty('--brand-primary', theme.primary);
    document.documentElement.style.setProperty('--brand-accent', theme.accent);
    
    // Derived RGB for background overlays
    const rgb = hexToRgb(theme.primary);
    if (rgb) {
        document.documentElement.style.setProperty('--brand-primary-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
    }
}


// Helper to convert hex to RGB object
function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
    } : null;
}


// Animate number count-up
function animateNumber(id, finalValue) {
    const el = document.getElementById(id);
    if (!el) return;
    
    const startValue = 0;
    const duration = 1000;
    let startTime = null;

    function step(timestamp) {
        if (!startTime) startTime = timestamp;
        const progress = Math.min((timestamp - startTime) / duration, 1);
        const current = Math.floor(progress * (finalValue - startValue) + startValue);
        el.innerText = current;
        
        if (progress < 1) {
            window.requestAnimationFrame(step);
        } else {
            el.classList.add("pulse-value");
            setTimeout(() => el.classList.remove("pulse-value"), 500);
        }
    }
    window.requestAnimationFrame(step);
}
